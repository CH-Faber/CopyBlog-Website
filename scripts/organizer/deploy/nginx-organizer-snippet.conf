# Place this more-specific prefix before the existing /api/ gosync location.
location ^~ /api/organizer/ {
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 90s;
}

# Put these exact locations before the site's long-lived static asset regex.
# A stale service worker can otherwise keep an old Agenda client for a year.
location = /agenda/sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/agenda/" always;
    try_files $uri =404;
}

location = /agenda/manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
}
